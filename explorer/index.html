<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>CNS IB Explorer Alpha (Spike)</title>
    <style>
      body {
        margin: 0;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
          sans-serif;
        background: #05060a;
        color: #e5e7eb;
        display: flex;
        flex-direction: column;
        height: 100vh;
      }
      header {
        padding: 0.5rem 1rem;
        background: #0b1120;
        border-bottom: 1px solid #1f2937;
        display: flex;
        align-items: center;
        gap: 0.75rem;
      }
      header input {
        background: #020617;
        border: 1px solid #1f2937;
        color: #e5e7eb;
        padding: 0.25rem 0.5rem;
        border-radius: 4px;
      }
      header button {
        background: #4f46e5;
        border: none;
        color: white;
        padding: 0.35rem 0.75rem;
        border-radius: 4px;
        cursor: pointer;
        font-size: 0.9rem;
      }
      header button:hover {
        background: #6366f1;
      }
      #status {
        font-size: 0.8rem;
        color: #9ca3af;
      }
      #scene-container {
        flex: 1;
        position: relative;
      }
      canvas {
        display: block;
      }
      /* Sidebar Styles */
      #detail-panel {
        position: fixed;
        top: 3.5rem; /* Below header */
        right: 0;
        bottom: 0;
        width: 320px;
        background: #0f172a;
        border-left: 1px solid #1f2937;
        padding: 1rem;
        overflow-y: auto;
        transform: translateX(100%);
        transition: transform 0.3s ease-in-out;
        box-shadow: -4px 0 15px rgba(0, 0, 0, 0.5);
      }
      #detail-panel.open {
        transform: translateX(0);
      }
      .panel-section {
        margin-bottom: 1.5rem;
      }
      .panel-header {
        display: flex;
        justify-content: space-between;
        align-items: start;
        margin-bottom: 1rem;
        border-bottom: 1px solid #334155;
        padding-bottom: 0.5rem;
      }
      h2 { margin: 0; font-size: 1.25rem; color: #f8fafc; }
      h3 { margin: 0 0 0.5rem 0; font-size: 0.9rem; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.05em; }
      .close-btn {
        background: transparent;
        border: none;
        color: #94a3b8;
        font-size: 1.5rem;
        cursor: pointer;
        line-height: 1;
        padding: 0;
      }
      .close-btn:hover { color: #f8fafc; }
      
      /* Data attributes */
      .attr-grid {
        display: grid;
        grid-template-columns: auto 1fr;
        gap: 0.5rem 1rem;
        font-size: 0.9rem;
      }
      .attr-label { color: #94a3b8; }
      .attr-val { color: #e2e8f0; font-family: monospace; }
      
      /* Provenance List */
      .prov-list {
        list-style: none;
        padding: 0;
        margin: 0;
      }
      .prov-item {
        background: #1e293b;
        padding: 0.5rem;
        border-radius: 4px;
        margin-bottom: 0.5rem;
        font-size: 0.85rem;
        border-left: 3px solid #3b82f6;
      }
      .prov-uri {
        display: block;
        color: #60a5fa;
        text-decoration: none;
        margin-bottom: 0.25rem;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .prov-meta { color: #64748b; font-size: 0.75rem; }
    <!-- Three.js and OrbitControls from CDN (pinned to a version where UMD OrbitControls attaches to THREE) -->
    <script src="https://unpkg.com/three@0.149.0/build/three.min.js"></script>
    <script src="https://unpkg.com/three@0.149.0/examples/js/controls/OrbitControls.js"></script>
  </head>
  <body>
    <header>
      <div><strong>CNS Explorer (Spike)</strong></div>
      <label>
        Label:
        <input id="label-input" type="text" placeholder="TLS 1.3" />
      </label>
      <label>
        Hops:
        <input
          id="hops-input"
          type="number"
          min="1"
          value="1"
          style="width: 3rem"
        />
      </label>
      <label>
        ASOF:
        <input
          id="asof-input"
          type="text"
          placeholder="2025-01-01T00:00:00Z"
          style="width: 14rem"
        />
      </label>
      <button id="load-btn">Load Neighborhood</button>
      <div id="status"></div>
    </header>
    <div id="scene-container"></div>
    
    <!-- Detail Panel Sidebar -->
    <aside id="detail-panel">
      <div class="panel-header">
        <h2 id="panel-title">Node Details</h2>
        <button class="close-btn" onclick="closePanel()">×</button>
      </div>
      <div id="panel-content">
        <div class="panel-section">
          <h3>Properties</h3>
          <div class="attr-grid" id="node-props">
            <!-- populated by JS -->
          </div>
        </div>
        <div class="panel-section" id="prov-section" style="display:none">
          <h3>Provenance</h3>
          <ul class="prov-list" id="prov-list"></ul>
        </div>
        <div class="panel-section" id="aspects-section" style="display:none">
          <h3>Aspects / Beliefs</h3>
          <div class="attr-grid" id="aspects-list"></div>
        </div>
      </div>
    </aside>

    <script>
      const API_BASE = "http://127.0.0.1:8000"; // adjust if needed

      const container = document.getElementById("scene-container");
      const statusEl = document.getElementById("status");
      const labelInput = document.getElementById("label-input");
      const hopsInput = document.getElementById("hops-input");
      const asofInput = document.getElementById("asof-input");
      const loadBtn = document.getElementById("load-btn");

      let scene, camera, renderer, controls;
      let scene, camera, renderer, controls, raycaster, mouse;
      let nodeGroup, edgeGroup;
      let hoveredNodeId = null;
      let nodeRefMap = new Map(); // Mesh UUID -> Node Data

      function initScene() {
        const width = container.clientWidth || window.innerWidth;
        const height = container.clientHeight || window.innerHeight - 48;

        scene = new THREE.Scene();
        scene.background = new THREE.Color(0x020617);

        camera = new THREE.PerspectiveCamera(60, width / height, 0.1, 1000);
        camera.position.set(0, 0, 40);

        renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(width, height);
        container.innerHTML = "";
        container.appendChild(renderer.domElement);

        if (THREE.OrbitControls) {
          controls = new THREE.OrbitControls(camera, renderer.domElement);
          controls.enableDamping = true;
          controls.dampingFactor = 0.08;
        } else {
          controls = null;
        }

        const ambient = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambient);
        const dir = new THREE.DirectionalLight(0xffffff, 0.8);
        dir.position.set(10, 10, 20);
        scene.add(dir);

        nodeGroup = new THREE.Group();
        edgeGroup = new THREE.Group();
        scene.add(nodeGroup);
        scene.add(nodeGroup);
        scene.add(edgeGroup);

        raycaster = new THREE.Raycaster();
        mouse = new THREE.Vector2();

        container.addEventListener("pointermove", onPointerMove);
        container.addEventListener("click", onClick);

        window.addEventListener("resize", onWindowResize);
        animate();
      }

      function onWindowResize() {
        if (!renderer || !camera) return;
        const width = container.clientWidth || window.innerWidth;
        const height = container.clientHeight || window.innerHeight - 48;
        camera.aspect = width / height;
        camera.updateProjectionMatrix();
        renderer.setSize(width, height);
      }

      function animate() {
        requestAnimationFrame(animate);
        if (controls) controls.update();
        if (renderer && scene && camera) {
          renderer.render(scene, camera);
        }
      }

      function layoutNodes(nodes, centerNodeId) {
        // Simple deterministic layout: place nodes around a circle, central node near origin.
        const positions = new Map();
        const n = nodes.length;
        const radius = Math.max(10, 4 + n * 0.5);

        let central = null;
        if (centerNodeId != null) {
          central = nodes.find((n) => n.id === centerNodeId) || null;
        }
        if (!central) {
          // Fallback to label match for now if center_node_id is not present.
          central = nodes.find((n) => n.label === labelInput.value.trim()) || null;
        }
        if (central) {
          positions.set(central.id, new THREE.Vector3(0, 0, 0));
        }

        let angleIdx = 0;
        for (const node of nodes) {
          if (positions.has(node.id)) continue;
          const angle = (angleIdx / Math.max(1, n - 1)) * Math.PI * 2;
          const x = radius * Math.cos(angle);
          const y = radius * Math.sin(angle);
          const z = (Math.random() - 0.5) * radius * 0.3;
          positions.set(node.id, new THREE.Vector3(x, y, z));
          angleIdx += 1;
        }
        return positions;
      }

      function renderGraph(data) {
        nodeGroup.clear();
        edgeGroup.clear();

        const nodes = data.nodes || [];
        const edges = data.edges || [];
        if (!nodes.length) {
          statusEl.textContent = "No nodes returned.";
          return;
        }

        const positions = layoutNodes(nodes, data.center_node_id ?? null);

        const centerId = data.center_node_id ?? null;

        const sphereGeom = new THREE.SphereGeometry(0.6, 16, 16);
        const matCentral = new THREE.MeshStandardMaterial({ color: 0x38bdf8 });
        const matOther = new THREE.MeshStandardMaterial({ color: 0x6366f1 });

        for (const node of nodes) {
          const pos = positions.get(node.id) || new THREE.Vector3();
          const isCentral = centerId != null && node.id === centerId;
          const mesh = new THREE.Mesh(
            sphereGeom,
            isCentral ? matCentral : matOther
          );
          mesh.position.copy(pos);
          mesh.userData = { id: node.id, label: node.label }; // Store ID for raycasting
          nodeGroup.add(mesh);
          nodeRefMap.set(mesh.uuid, node);
        }

        const edgeMat = new THREE.LineBasicMaterial({
          color: 0x4b5563,
          linewidth: 1,
        });
        for (const e of edges) {
          const srcPos = positions.get(e.src_id);
          const dstPos = positions.get(e.dst_id);
          if (!srcPos || !dstPos) continue;
          const geom = new THREE.BufferGeometry().setFromPoints([
            srcPos,
            dstPos,
          ]);
          const line = new THREE.Line(geom, edgeMat);
          edgeGroup.add(line);
        }

        const truncatedSuffix = data.truncated ? " (truncated)" : "";
        statusEl.textContent = `Rendered ${nodes.length} nodes and ${edges.length} edges${truncatedSuffix}.`;
      }

      async function loadNeighborhood() {
        const label = labelInput.value.trim();
        const hops = parseInt(hopsInput.value || "1", 10) || 1;
        const asofRaw = asofInput.value.trim();
        if (!label) {
          statusEl.textContent = "Enter a label first.";
          return;
        }
        statusEl.textContent = "Loading neighborhood…";
        try {
          const params = new URLSearchParams();
          params.set("label", label);
          params.set("hops", String(hops));
          if (asofRaw) {
            params.set("asof", asofRaw);
          }
          const url = `${API_BASE}/graph/neighborhood?${params.toString()}`;
          const resp = await fetch(url);
          if (!resp.ok) {
            const detail = await resp.json().catch(() => ({}));
            statusEl.textContent = `Error ${resp.status}: ${
              detail.detail || "request failed"
            }`;
            return;
          }
          const data = await resp.json();
          renderGraph(data);
        } catch (err) {
          console.error(err);
          statusEl.textContent = "Network or server error; see console.";
        }
      }

      loadBtn.addEventListener("click", loadNeighborhood);
      labelInput.addEventListener("keydown", (e) => {
        if (e.key === "Enter") {
          loadNeighborhood();
        }
      });

      // Interaction Logic
      function onPointerMove(event) {
        // Normalize mouse coordinates (0,0 center)
        const rect = container.getBoundingClientRect();
        mouse.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
        mouse.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;
      }

      function onClick() {
        // Raycast against nodes
        raycaster.setFromCamera(mouse, camera);
        const intersects = raycaster.intersectObjects(nodeGroup.children);
        
        if (intersects.length > 0) {
          const selected = intersects[0].object;
          const nodeId = selected.userData.id;
          if (nodeId) {
            console.log("Clicked:", nodeId);
            fetchNodeDetails(nodeId);
          }
        } else {
          // closePanel(); // Optional: close on click background?
        }
      }

      const panel = document.getElementById("detail-panel");
      const panelTitle = document.getElementById("panel-title");
      const nodeProps = document.getElementById("node-props");
      const provList = document.getElementById("prov-list");
      const provSection = document.getElementById("prov-section");
      
      function closePanel() {
        panel.classList.remove("open");
      }

      async function fetchNodeDetails(nodeId) {
        statusEl.textContent = `Loading details for Node ${nodeId}...`;
        try {
          const asof = asofInput.value.trim();
          const url = `${API_BASE}/graph/node/${nodeId}` + (asof ? `?asof=${asof}` : "");
          
          const resp = await fetch(url);
          if (!resp.ok) throw new Error(`API ${resp.status}`);
          
          const data = await resp.json();
          renderDetailPanel(data);
          statusEl.textContent = `Loaded details for ${data.node.label}`;
        } catch (err) {
          console.error(err);
          statusEl.textContent = "Failed to load node details.";
        }
      }

      function renderDetailPanel(data) {
        const node = data.node;
        const prov = data.provenance; // { assertions_count, sources_count }
        
        panelTitle.textContent = node.label;
        
        // Basic Props
        nodeProps.innerHTML = `
          <span class="attr-label">ID</span> <span class="attr-val">${node.id}</span>
          <span class="attr-label">Kind</span> <span class="attr-val">${node.kind || "N/A"}</span>
          <span class="attr-label">Belief</span> <span class="attr-val">${(node.belief ?? 1.0).toFixed(2)}</span>
        `;

        // Provenance Section (Mocking list since API currently summarizes counts)
        // Ideally we'd list actual sources if the API returned them in detail response
        provSection.style.display = "block";
        provList.innerHTML = "";
        
        if (prov) {
           const item = document.createElement("li");
           item.className = "prov-item";
           item.innerHTML = `
             <div class="prov-uri">Sources Count: ${prov.sources_count}</div>
             <div class="prov-meta">Assertions: ${prov.assertions_count}</div>
           `;
           provList.appendChild(item);
        } else {
           provList.innerHTML = "<li style='color:#64748b'>No provenance data</li>";
        }

        // Aspects (Future Work: Iterate data.aspects)
        
        panel.classList.add("open");
      }

      initScene();
    </script>
  </body>
</html>
